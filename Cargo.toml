[workspace]
resolver = "2"

members = [
    "abi",
    "types",
    "types-macros",
    "bytecode",
    "vm",
    "assembler",
    "ast",
    "parser",
    "lexer",
    "environment",
    "builder",
    "compiler",
    "decompiler",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/xelis-project/xelis-vm"

[workspace.dependencies]
silex-ast = { path = "ast", version = "0.1.0" }
silex-builder = { path = "builder", version = "0.1.0" }
silex-bytecode = { path = "bytecode", version = "0.1.0" }
silex-compiler = { path = "compiler", version = "0.1.0" }
silex-environment = { path = "environment", version = "0.1.0" }
silex-lexer = { path = "lexer", version = "0.1.0" }
silex-parser = { path = "parser", version = "0.1.0" }
silex-types-macros = { path = "types-macros", version = "0.1.0" }
silex-types = { path = "types", version = "0.1.0" }
xelis-vm = { path = "vm", version = "0.1.0" }

octet = "0.3.0"
matriochka = "0.1.1"
better_any = "0.2.0"
criterion = "0.5.1"
futures = "0.3.31"
hashbrown = "0.17"
hex = "0.4.3"
indexmap = "2.8.0"
lazy_static = "1.5.0"
log = "0.4.26"
paste = "1.0.15"
runtime-context = "0.1.1"
schemars = "1.0.4"
serde = "1.0.215"
serde_json = "1.0.133"
thiserror = "2.0.3"

proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
proc-macro-crate = "3"
